# YOLOv12 with P2 head + MFEblock + MSEFBlock fusion
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:   # 完全不变
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

head:
  # ---------- P2 branch (unchanged) ----------
  - [1, 1, Conv, [128, 1, 1]]
  - [-1, 1, C3k2, [128, False, 0.25]]        # index 10 (P2 output)

  # ---------- P3 branch (A2C2f replaced by MSEFBlock) ----------
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]          # index 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, MSEFBlock, [256, 16]]              # index 16: replace A2C2f with MSEFBlock (256→256)

  # ---------- P4 branch (A2C2f replaced by MFEblock) ----------
  - [-1, 1, Conv, [256, 3, 2]]                 # index 17 (downsample from P3)
  - [[-1, 13], 1, Concat, [1]]                # index 18
  - [-1, 1, MFEblock, [512, [2,4,8]]]          # index 19: replace A2C2f with MFEblock (512→512)

  # ---------- P5 branch (add MSEFBlock after C3k2) ----------
  - [-1, 1, Conv, [512, 3, 2]]                 # index 20
  - [[-1, 8], 1, Concat, [1]]                 # index 21
  - [-1, 2, C3k2, [1024, True]]               # index 22
  - [-1, 1, MSEFBlock, [1024, 16]]             # index 23: extra MSEFBlock on P5 (1024→1024)

  # ---------- Detect (indices adjusted) ----------
  - [[10, 16, 19, 23], 1, Detect, [nc]]        # index 24